name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend integration and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    env:
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22.19.0
        uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Restore in-memory MongoDB binary
        uses: actions/cache@v5
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-mongodb-memory-${{ hashFiles('server/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mongodb-memory-

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        run: npm run check:syntax

      - name: Run backend integration tests
        run: npm test

      - name: Enforce backend coverage thresholds
        run: npm run test:coverage

      - name: Audit backend dependencies
        run: npm audit --audit-level=high

  frontend:
    name: Frontend production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22.19.0
        uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend for production
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
